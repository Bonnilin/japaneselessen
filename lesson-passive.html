      <h2><span class="tag">N4</span> 當你被命運選中的那一刻</h2>
      <p>受身形（被動式）是 N4 的重要文法之一，能表達「被…做了…」。它不只用在客觀事實，也常用來表達「遭受」某件不愉快的事（迷惑の受身），這在故事、對話中非常常見。</p>
