<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="title">ニホンゴ・クエスト</span>

<main>
  <div class="section-title">
    <span class="bolt">🈁</span>
    <h2>片假名 50 音表</h2>
  </div>
  <div class="panel accent-teal">
    <span class="sfx-flourish">ビシッ!!</span>
    <p>片假名主要用來寫外來語、擬聲擬態語跟人名地名。點擊任一個字瀏覽器就會唸出發音，練熟表格後別忘了往下挑戰片假名單字閃卡！</p>
  </div>

  <section id="katakana-table-section">
    <div class="gojuon-tools">
      <button class="kana-tab active" data-category="seion">清音</button>
      <button class="kana-tab" data-category="dakuten">濁音</button>
      <button class="kana-tab" data-category="handakuten">半濁音</button>
      <button class="kana-tab" data-category="youon">拗音</button>
    </div>
    <div class="panel">
      <div class="gojuon-grid jp" id="katakana-grid"></div>
    </div>
    <div class="btn-row">
      <button class="btn pink" id="katakana-quiz-btn">📝 開始片假名小測驗（隨機10題）</button>
    </div>
  </section>

  <section id="katakana-quiz" style="display:none;">
    <div class="panel accent-pink" id="katakana-quiz-container"></div>
    <div class="btn-row">
      <button class="btn secondary" id="katakana-back-btn">← 回到片假名表</button>
    </div>
  </section>

  <div class="stripe-divider"></div>

  <div class="section-title">
    <span class="bolt">🃏</span>
    <h2>片假名單字閃卡</h2>
  </div>

  <div class="panel accent-purple">
    <span class="sfx-flourish">キラーン✨</span>
    <p>18 個生活常用外來語單字，點卡片翻面查看意思，依熟悉程度分級後系統會自動安排下次複習時間（SRS 間隔重複），跟單字閃卡頁邏輯一樣。</p>
    <div class="deck-status" id="deck-status"></div>
  </div>

  <div class="flash-stage" id="flash-stage"></div>

  <div class="btn-row" style="justify-content:center;">
    <button class="btn secondary" id="practice-all-btn">🔁 不管進度，直接練習全部單字</button>
  </div>
</main>

<footer class="site-footer">
